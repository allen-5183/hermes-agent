<h1>隱私權政策</h1>
<p>Hermes Agent 為個人自用工具，僅存取開發者本人授權的 Google 帳號資料（Gmail、日曆、雲端硬碟、文件、試算表、聯絡人）。</p>
<ul>
<li>資料僅在使用者自己的伺服器上處理，不會分享、出售或提供給任何第三方。</li>
<li>OAuth 權杖只儲存在使用者自己的伺服器。</li>
<li>使用者可隨時在 Google 帳戶的「第三方存取權」頁面撤銷授權。</li>
</ul>
